name: ShirazLastNews Studio Bot

on:
  schedule:
    # 06:00، 11:00، 16:00 و 19:30 به وقت تهران (پوشش کامل ۶ صبح تا ۱۲ شب)
    - cron: '30 2 * * *'
    - cron: '30 7 * * *'
    - cron: '30 12 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: shirazlastnews-studio-bot
  cancel-in-progress: true

jobs:
  run-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Persian Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-vazirmatn
          mkdir -p fonts
          curl -sL "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Bold.ttf" -o fonts/Vazirmatn-Bold.ttf || true
          curl -sL "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-Regular.ttf" -o fonts/Vazirmatn-Regular.ttf || true
          curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/lalezar/Lalezar-Regular.ttf" -o fonts/Lalezar-Regular.ttf || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Studio Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python main.py
